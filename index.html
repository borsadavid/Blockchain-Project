<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Tokens</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.6.0/dist/ethers.umd.min.js"></script>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1>Send Tokens</h1>

  <!-- Wallet Connections -->
  <div>
    <button id="connectMetaMask">Connect MetaMask Wallet</button>
    <p><strong>MetaMask Address:</strong> <span id="metaMaskAddress">Not Connected</span></p>
  </div>
  
  <div>
    <button id="connectSolanaWallet">Connect Phantom Wallet</button>
    <p><strong>Phantom Wallet Address:</strong> <span id="solanaAddress">Not Connected</span></p>
  </div>
  
  <hr>
  
  <!-- Ether Price Section -->
  <h2>Current Ether Price</h2>
  <div class="account-info">
    <p><strong>Price (USD):</strong> <span id="etherPrice">Loading...</span></p>
  </div>

  <hr>

  <!-- Token Transfer Section -->
  <form id="transferForm">
    <label for="amount"><strong>Amount to Transfer:</strong></label>
    <input type="number" id="amount" placeholder="Enter amount" required><br><br>
    <button type="button" id="sendMetaMaskToPhantom">Send from MetaMask to Phantom</button>
    <br>
    <button type="button" id="sendPhantomToMetaMask">Send from Phantom to MetaMask</button>
  </form>

  <hr>

  <!-- Account Info Section -->
  <h2>Account Info</h2>
  <div class="account-info">
    <p><strong>Token Balance on:</strong> <br> <span id="tokenBalance">Loading...</span></p>
    <br>
    <p><strong>Ether Balance:</strong> <span id="etherBalance">Loading...</span></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
